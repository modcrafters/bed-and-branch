# Every field added here must also be added to the expandProps map in
# build-logic/src/main/groovy/multiloader-common.gradle, or resource expansion
# fails with a missing property.
# Minecraft, Java and loader versions differ per version, so they live in each
# version's gradle.properties: versions/<mc>, fabric/versions/<mc> and neoforge/versions/<mc>.
# Values shared by every version of one loader live in fabric/ and neoforge/gradle.properties.
version=0.1.0
group=net.modcrafters.minecraft
mod_name=Bed & Branch
mod_author=modcrafters
mod_id=bed_and_branch
license=MIT
credits=
description=Soils, crop sticks, bushes, trees, and grafting.

# Stonecutter refuses to run when the generated sources are not the VCS version.
dev.kikugie.stonecutter.hard_mode=true

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
