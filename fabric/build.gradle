plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    // Dev runs only. Loom's localRuntime is not on the compile classpath and is not published.
    // Minecraft 26.3 is unobfuscated, so there is no modLocalRuntime configuration.
    localRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-api'
    }
    compileOnly "maven.modrinth:jade:${jade_version}+fabric"
    localRuntime "maven.modrinth:jade:${jade_version}+fabric"
}

loom {
    def aw = rootProject.file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        gametest {
            server()
            setConfigName('Fabric Game Test')
            ideConfigGenerated(true)
            vmArg('-Dfabric-api.gametest')
            vmArg("-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml")
            runDir('runs/gametest')
        }
        clientGametest {
            client()
            setConfigName('Fabric Client Game Test')
            ideConfigGenerated(true)
            vmArg('-Dfabric.client.gametest')
            runDir('runs/clientGametest')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
